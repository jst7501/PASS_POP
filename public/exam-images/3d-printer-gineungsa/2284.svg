<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="280" height="130" role="img" aria-label="제1각법 투상 기호">
  <rect width="280" height="130" fill="#ffffff"/>
  <!-- dash-dot center lines -->
  <g stroke="#9aa0ad" stroke-width="1.2" stroke-dasharray="12 3 2 3">
    <line x1="18" y1="65" x2="262" y2="65"/>
    <line x1="196" y1="22" x2="196" y2="108"/>
  </g>
  <!-- frustum: big (tall) end on the LEFT, small end on the RIGHT -->
  <path d="M50,28 L50,102 L128,82 L128,48 Z" fill="none" stroke="#2b2f38" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- concentric circles (end view) on the RIGHT -->
  <circle cx="196" cy="65" r="34" fill="none" stroke="#2b2f38" stroke-width="2.4"/>
  <circle cx="196" cy="65" r="16" fill="none" stroke="#2b2f38" stroke-width="2.4"/>
  <circle cx="196" cy="65" r="2.2" fill="#2b2f38"/>
</svg>
